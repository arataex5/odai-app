name: Deploy Pages

# リポジトリ直下をそのまま GitHub Pages へ公開します。
# 有効にするには Settings → Pages → Source を「GitHub Actions」にしてください。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 公開用ディレクトリを作成
        run: |
          mkdir -p _site
          cp -r index.html manifest.json sw.js css js data icons .nojekyll _site/
          if [ -d download ]; then cp -r download _site/; fi
          ls -R _site | head -40

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
