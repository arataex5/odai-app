name: Build APK

# 手動実行、または main への push（Web アセット変更時）で APK をビルドします。
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'download/odai-box.apk を更新してリリースも作成する'
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sw.js'
      - 'manifest.json'
      - 'css/**'
      - 'js/**'
      - 'data/**'
      - 'icons/**'
      - 'assets/**'
      - 'capacitor.config.json'
      - 'package.json'
      - 'tools/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.js 22 を用意（Capacitor 8 の CLI に必須）
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: JDK 21 を用意
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK を用意
        uses: android-actions/setup-android@v3

      - name: 依存関係をインストール
        run: npm install --no-audit --no-fund

      - name: バージョンを取得
        id: ver
        run: |
          VER=$(node -p "require('fs').readFileSync('sw.js','utf8').match(/APP_VERSION\s*=\s*'([^']+)'/)[1]")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$VER"

      - name: www/ を作成
        run: npm run build:www

      - name: Android プロジェクトを生成
        run: npx cap add android

      - name: アイコン・スプラッシュを生成
        run: npx capacitor-assets generate --android --assetPath assets

      - name: Capacitor を同期
        run: npx cap sync android

      - name: バージョンを反映
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: node tools/set-android-version.mjs

      - name: 署名鍵を準備（Secrets があれば release ビルド）
        id: sign
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/android/app/release.keystore"
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "署名あり（release）でビルドします"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "署名鍵が未設定のため debug ビルドします（インストールは可能です）"
          fi

      - name: APK をビルド
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          chmod +x ./gradlew
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            ./gradlew --no-daemon assembleRelease \
              -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/android/app/release.keystore" \
              -Pandroid.injected.signing.store.password="$KS_PASS" \
              -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
              -Pandroid.injected.signing.key.password="$KEY_PASS"
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: APK の場所を特定
        id: apk
        run: |
          FILE=$(find android/app/build/outputs/apk -name '*.apk' ! -name '*unsigned*' | head -n1)
          if [ -z "$FILE" ]; then echo "APK が見つかりません"; exit 1; fi
          echo "path=$FILE" >> "$GITHUB_OUTPUT"
          echo "size=$(du -h "$FILE" | cut -f1)" >> "$GITHUB_OUTPUT"
          ls -la "$FILE"

      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@v4
        with:
          name: odai-box-apk-v${{ steps.ver.outputs.version }}
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: 署名鍵を削除
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/android/app/release.keystore"

      # ---- ここから配布用（ダウンロード導線）----
      - name: 配布ファイル（download/）を更新してコミット
        if: github.event_name == 'push' || inputs.publish
        env:
          VER: ${{ steps.ver.outputs.version }}
          SIGNED: ${{ steps.sign.outputs.signed }}
        run: |
          mkdir -p download
          cp "${{ steps.apk.outputs.path }}" download/odai-box.apk
          node -e '
            const fs = require("fs");
            const size = fs.statSync("download/odai-box.apk").size;
            fs.writeFileSync("download/apk-info.json", JSON.stringify({
              available: true,
              file: "odai-box.apk",
              size,
              version: process.env.VER,
              built: new Date().toISOString(),
              signed: process.env.SIGNED === "true" ? "release" : "debug"
            }, null, 2) + "\n");
          '
          cat download/apk-info.json
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f download/odai-box.apk download/apk-info.json
          if git diff --staged --quiet; then
            echo "配布ファイルに変更なし"
          else
            git commit -m "chore: update download/ (お題ボックス v${{ steps.ver.outputs.version }}) [skip ci]"
            git pull --rebase --autostash
            git push
          fi

      - name: リリースを作成／更新
        if: github.event_name == 'push' || inputs.publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: お題ボックス v${{ steps.ver.outputs.version }}
          body: |
            お題ボックス v${{ steps.ver.outputs.version }} の Android アプリ（APK）です。
            署名: ${{ steps.sign.outputs.signed == 'true' && 'release（自前の署名鍵）' || 'debug（署名鍵未設定）' }}
            サイズ: ${{ steps.apk.outputs.size }}

            インストール手順はアプリのタイトル画面「オフラインで使えるアプリをインストールする」からも確認できます。
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
